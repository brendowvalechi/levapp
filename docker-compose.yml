services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: levapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fretefacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fretefacil123}
      POSTGRES_DB: ${POSTGRES_DB:-fretefacil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fretefacil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: levapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./frete-facil-api
      dockerfile: Dockerfile
    container_name: levapp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fretefacil}:${POSTGRES_PASSWORD:-fretefacil123}@db:5432/${POSTGRES_DB:-fretefacil}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./frete-facil-api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./frete-facil-api
      dockerfile: Dockerfile
    container_name: levapp-celery
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fretefacil}:${POSTGRES_PASSWORD:-fretefacil123}@db:5432/${POSTGRES_DB:-fretefacil}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./frete-facil-api:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q default

volumes:
  postgres_data:
  redis_data:
