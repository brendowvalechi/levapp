name: API CI

on:
  push:
    branches: [main, develop]
    paths: ["frete-facil-api/**"]
  pull_request:
    branches: [main]
    paths: ["frete-facil-api/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frete-facil-api

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: fretefacil
          POSTGRES_PASSWORD: fretefacil123
          POSTGRES_DB: fretefacil_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: frete-facil-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      - name: Type check (mypy)
        run: |
          pip install mypy
          mypy app --ignore-missing-imports || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://fretefacil:fretefacil123@localhost:5432/fretefacil_test
          DATABASE_URL_SYNC: postgresql+psycopg2://fretefacil:fretefacil123@localhost:5432/fretefacil_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci
          ENVIRONMENT: test
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: frete-facil-api/coverage.xml
          flags: backend
